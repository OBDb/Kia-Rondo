generations:
  - name: "First Generation (RS/FJ)"
    start_year: 1999
    end_year: 2005
    description: "The first-generation Kia Carens (RS series) debuted in May 1999, based on the same platform as the Kia Sephia. It was marketed as a compact MPV offering practical family transportation with a focus on space efficiency and value. Available in various configurations including five-seat and seven-seat options depending on the market, it featured a straightforward, functional interior with durable materials. Engine options typically included 1.8L and 2.0L four-cylinder engines paired with manual or automatic transmissions. A facelift was issued in 2002, updating the exterior styling and interior features. The model was discontinued in Australia in 2001, but production continued elsewhere until the updated 2002 model remained on sale through approximately 2005. In Malaysia, this generation was rebadged as the Naza Citra from January 2005 onwards. This generation established the Carens as Kia's entry into the compact MPV segment, competing with other value-oriented family vehicles in global markets."

  - name: "Second Generation (UN)"
    start_year: 2006
    end_year: 2012
    description: "The second-generation Carens, known as the UN series, was launched in 2006 following Kia's introduction of the Multi-S concept at the Frankfurt Motor Show. In North America and Australia, the model was marketed as the Kia Rondo and Rondo7 respectively. The Rondo made its public debut at the 2006 Los Angeles International Auto Show, with North American sales beginning in December 2006 in Canada and early 2007 in the United States. Available as a five or optional seven-passenger vehicle, it was powered by either a 175 hp 2.4-liter four-cylinder engine or an optional 192 hp 2.7-liter V6 engine, paired with automatic transmissions. Standard features included sixteen-inch alloy wheels, AM/FM/CD player with Sirius Satellite Radio, iPod auxiliary jack, air conditioning, power windows and door locks, front/side/full-length side curtain airbags, four-wheel disc brakes, ABS, electronic stability control, and tire pressure monitoring. Options included a moonroof, leather interior, heated front seats, cruise control, keyless entry, and Infinity ten-speaker stereo. In the United States, sales exceeded 20,000 units in each of the first two model years but declined rapidly thereafter. Kia discontinued the Rondo in the United States after August 2010, though it continued in Canada with a 2011 facelift adopting Kia's new grille design."

  - name: "Third Generation (RP)"
    start_year: 2013
    end_year: 2019
    description: "The third-generation Carens (codename: RP) debuted in September 2012 at the Paris Motor Show, featuring more sophisticated, European-influenced styling under the direction of Peter Schreyer. Sales began in March 2013 in South Korea. The V6 engine from the previous generation was dropped, replaced with a 2.0-liter Nu four-cylinder GDI petrol engine or a 1.7-liter U2 four-cylinder diesel engine, both available with six-speed manual or automatic transmissions. In the UK, a 1.6-liter GDI petrol engine was also offered. The Carens was offered in five-seat or seven-seat configurations. In North America, this generation was only available in Canada due to slow sales in the United States, with Canadian sales ending after the 2017 model year. A minor facelift in September 2016 brought redesigned fascias, wheels, lights, and an enlarged 'Tiger Nose' grille. The diesel engine was retuned for improved output, and the automatic transmission was upgraded to a seven-speed dual-clutch unit. The interior saw significant improvements in design, material quality, and technology, offering features like a touchscreen infotainment system and panoramic sunroof on higher trims."

  - name: "Fourth Generation (KY)"
    start_year: 2021
    end_year: null
    description: "The fourth-generation Carens (codename: KY) was revealed in India on December 16, 2021, representing a significant shift in the model's positioning and design. Based on a stretched Seltos/Hyundai Creta platform, it was developed primarily for emerging markets like India rather than traditional Western markets. Unlike previous generations' compact MPV configuration, this model is configured as a compact crossover with SUV-inspired styling, marketed by Kia as a 'recreational vehicle' (RV). Available in six-seater and seven-seater configurations, it emphasizes space for third-row seat occupants. Powertrain options shared with the Indian-made Seltos include a 1.5-liter naturally aspirated petrol engine (115 hp) with six-speed manual or CVT, a 1.4-liter turbocharged petrol engine (140 hp) with six-speed manual or seven-speed dual-clutch transmission, and a 1.5-liter diesel engine (115 hp) with six-speed manual or automatic transmission. The interior features a 10.25-inch touchscreen, digital instrument cluster, and comprehensive connectivity options. Safety features include six airbags, ABS, electronic stability control, hill-hold assist, and advanced driver assistance systems on higher trims. Although not sold in North America (where the Rondo name has been retired), this generation adapts the Carens concept for the crossover-dominated modern market while maintaining its focus on practicality, value, and family-friendly features. In 2025, Kia introduced the Carens Clavis premium variant with enhanced design, technology features including dual 12.25-inch displays, and Level 2 ADAS."
